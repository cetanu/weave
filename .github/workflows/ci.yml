name: CI

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run --no-sync pytest
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: cargo fmt --check
      - run: uv run --no-sync -- cargo clippy --locked --all-targets -- -D warnings
      - run: uv run --no-sync maturin build --release --locked
        if: matrix.os != 'ubuntu-latest'
      - uses: PyO3/maturin-action@v1.51.0
        if: matrix.os == 'ubuntu-latest'
        with:
          maturin-version: 1.15.0
          manylinux: "2_28"
          args: --release --locked -i python${{ matrix.python }} --compatibility pypi --out target/wheels
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: target/wheels/*.whl

  performance:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - name: Register benchmark runner
        run: |
          os_name="$(. /etc/os-release && echo "$PRETTY_NAME")"
          cpu="$(lscpu | awk -F: '/Model name/ {gsub(/^[[:space:]]+/, "", $2); print $2; exit}')"
          ram="$(awk '/MemTotal/ {printf "%.0fGB", $2 / 1048576}' /proc/meminfo)"
          uv run asv machine --yes \
            --machine "github-${RUNNER_OS}-${RUNNER_ARCH}" \
            --os "$os_name" \
            --arch "$(uname -m)" \
            --cpu "$cpu" \
            --num_cpu "$(nproc)" \
            --ram "$ram"
      - name: Compare base and proposed revision
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: uv run asv continuous --factor 1.15 --interleave-rounds --split "$BASE" "$HEAD"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: asv-results-${{ github.run_id }}
          path: .asv/results
          if-no-files-found: ignore

  sdist:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: dist/*

  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [test, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/weaved/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: "wheel-*"
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: source-distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

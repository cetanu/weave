<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weaved performance history</title>
<style>
body{font:15px system-ui,sans-serif;max-width:1100px;margin:2rem auto;padding:0 1rem;color:#202124}h1{font-size:1.7rem}p{color:#5f6368}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:1rem}article{border:1px solid #dadce0;border-radius:8px;padding:1rem}h2{font-size:1rem;margin:0 0 .5rem}svg{width:100%;height:185px;overflow:visible}.axis{stroke:#dadce0}.line{fill:none;stroke:#188038;stroke-width:2.5}.dot{fill:#188038}.tick{fill:#5f6368;font-size:11px}
</style>
<h1>Weaved performance history</h1>
<p>Selected ASV timings on GitHub Actions, CPython 3.14. Each chart is normalized to its first recorded merge (100); lower is faster. Runner noise can affect small changes.</p>
<div id="charts" class="grid"></div>
<script>
const data=[], ns='http://www.w3.org/2000/svg';
function el(tag,attrs={}){const n=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);return n}
const names=[...new Set(data.flatMap(r=>Object.keys(r.benchmarks)))];
for(const name of names){
 const rows=data.filter(r=>Number.isFinite(r.benchmarks[name]));if(!rows.length)continue;
 const base=rows[0].benchmarks[name],values=rows.map(r=>100*r.benchmarks[name]/base);
 const low=Math.min(95,...values),high=Math.max(105,...values),pad=(high-low)*.12||5,min=low-pad,max=high+pad;
 const W=500,H=185,L=48,R=12,T=14,B=30,iw=W-L-R,ih=H-T-B;
 const x=i=>L+(rows.length===1?iw/2:i*iw/(rows.length-1)),y=v=>T+(max-v)*ih/(max-min);
 const svg=el('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':name+' performance history'});
 for(const v of [min,(min+max)/2,max]){const yy=y(v);svg.append(el('line',{x1:L,y1:yy,x2:W-R,y2:yy,class:'axis'}));const t=el('text',{x:L-6,y:yy+4,'text-anchor':'end',class:'tick'});t.textContent=v.toFixed(0);svg.append(t)}
 svg.append(el('polyline',{points:values.map((v,i)=>`${x(i)},${y(v)}`).join(' '),class:'line'}));
 rows.forEach((r,i)=>{const dot=el('circle',{cx:x(i),cy:y(values[i]),r:4,class:'dot'}),tip=el('title');tip.textContent=`${r.commit.slice(0,7)} · ${new Date(r.date).toLocaleDateString()} · ${(r.benchmarks[name]*1e6).toFixed(2)} µs`;dot.append(tip);svg.append(dot)});
 const a=el('text',{x:L,y:H-5,class:'tick'});a.textContent=rows[0].commit.slice(0,7);svg.append(a);
 const b=el('text',{x:W-R,y:H-5,'text-anchor':'end',class:'tick'});b.textContent=rows.at(-1).commit.slice(0,7);svg.append(b);
 const card=document.createElement('article'),heading=document.createElement('h2');heading.textContent=name;card.append(heading,svg);document.querySelector('#charts').append(card);
}
</script></html>
